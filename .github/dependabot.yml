# Dependabot proposes, as pull requests, new versions of the GitHub tools the checks use, once a
# version is a week old (in case its maker is hacked).
# Iván merges them like any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
